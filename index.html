<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shinobu 5s Interactive Avatar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080511;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        /* Premium Background Gaps Filler Animation */
        .bg-glow {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 30% 20%, #4a154b 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, #1a2a6c 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #080511 0%, #020105 100%);
            z-index: 1;
            filter: blur(20px);
            animation: bgShift 15s infinite alternate linear;
        }
        @keyframes bgShift { 0% { transform: rotate(0deg) scale(1); } 100% { transform: rotate(360deg) scale(1.1); } }
        
        .particle-container { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .particle { position: absolute; background: radial-gradient(circle, rgba(187, 134, 252, 0.8) 0%, rgba(187, 134, 252, 0) 70%); border-radius: 50%; animation: floatUp 8s infinite linear; }
        @keyframes floatUp { 0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; } 50% { opacity: 0.7; } 100% { transform: translateY(-10vh) translateX(50px) scale(1.2); opacity: 0; } }
        
        .mobile-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .avatar-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; padding: 10px; }
        
        /* Main Avatar Container */
        .avatar-container { 
            width: 100%; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.3); 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            position: relative; 
            transform-origin: center center;
        }
        
        .avatar-img { width: 100%; height: auto; display: block; object-fit: cover; pointer-events: none; transition: all 0.3s ease; }

        /* --- ADVANCED EXPRESSION & MOVEMENT KEYFRAMES --- */
        
        /* 1. Listening Expression: Thoughtful head tilt, narrow focused eyes (scale-down filter) */
        @keyframes avatarListeningExpression {
            0% { transform: scale(1.01) rotate(1deg) translateY(-2px); filter: saturate(1.1) brightness(0.95); }
            50% { transform: scale(1.02) rotate(-1deg) translateY(-4px); filter: saturate(1.15) brightness(1); }
            100% { transform: scale(1.01) rotate(1deg) translateY(-2px); filter: saturate(1.1) brightness(0.95); }
        }

        /* 2. Speaking Expression: Continuous micro lip-sync (Y-axis stretch) and eye blinking movement (X-axis shift) */
        @keyframes avatarSpeakingLipsAndEyes {
            0% { transform: scale(1) scaleY(1.04) translateY(-1px); filter: brightness(1.1); }
            20% { transform: scale(1.03) scaleY(0.97) translateY(2px); filter: brightness(1.05); }
            40% { transform: scale(0.99) scaleY(1.05) translateY(-3px); filter: brightness(1.15); }
            60% { transform: scale(1.04) scaleY(0.96) translateY(1px); filter: brightness(1.08); }
            80% { transform: scale(1.01) scaleY(1.03) translateY(-2px); filter: brightness(1.12); }
            100% { transform: scale(1) scaleY(1) translateY(0); filter: brightness(1); }
        }

        /* Classes triggered dynamically via JS */
        .listening { 
            animation: avatarListeningExpression 2.5s infinite ease-in-out;
            box-shadow: 0 0 40px rgba(52, 152, 219, 0.8);
        }
        
        .speaking { 
            animation: avatarSpeakingLipsAndEyes 0.14s infinite alternate cubic-bezier(0.36, 0.07, 0.19, 0.97);
            box-shadow: 0 0 45px rgba(232, 67, 147, 0.9);
        }

        /* UI Control Elements */
        .hud-display { background: rgba(13, 8, 24, 0.9); backdrop-filter: blur(10px); padding: 25px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: calc(25px + env(safe-area-inset-bottom)); }
        .status-pill { display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; background: rgba(255, 255, 255, 0.1); margin-bottom: 12px; }
        .status-pill.ready { color: #a29bfe; border: 1px solid #6c5ce7; }
        .status-pill.listening-mode { color: #3498db; border: 1px solid #3498db; }
        .status-pill.speaking-mode { color: #e84393; border: 1px solid #e84393; }
        .subtitle-box { font-size: 1.1rem; color: #f1f2f6; min-height: 50px; line-height: 1.4; }
        
        /* 5s Reduced Visual Timer Bar */
        .timer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 5px;
            background: #e84393;
            width: 0%;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="particle-container" id="particleContainer"></div>

    <div class="mobile-frame">
        <!-- 5 Seconds Visual Progress Indicator -->
        <div class="timer-bar" id="timerBar"></div>
        
        <div style="height: 30px;"></div>
        <div class="avatar-wrapper" id="tapZone">
            <div class="avatar-container" id="avatarContainer">
                <img src="1387209.jpg" alt="Shinobu" class="avatar-img" id="animeImage" onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop'">
            </div>
        </div>
        <div class="hud-display">
            <div class="status-pill ready" id="statusPill">Tap to Talk (Max 5s)</div>
            <div class="subtitle-box" id="subtitles">Kuch bhi boliye, 5 second me cut ho jayega...</div>
        </div>
    </div>

    <script>
        // Decorative Particle Loop
        const pContainer = document.getElementById('particleContainer');
        for(let i=0; i<15; i++) {
            let p = document.createElement('div');
            p.classList.add('particle');
            p.style.width = p.style.height = Math.random() * 6 + 4 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDelay = Math.random() * 5 + 's';
            pContainer.appendChild(p);
        }

        const tapZone = document.getElementById('tapZone');
        const avatarContainer = document.getElementById('avatarContainer');
        const statusPill = document.getElementById('statusPill');
        const subtitles = document.getElementById('subtitles');
        const timerBar = document.getElementById('timerBar');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let isWorking = false;
        let maxTimeLimit;
        let recognitionInstance = null;

        if (SpeechRecognition) {
            recognitionInstance = new SpeechRecognition();
            recognitionInstance.continuous = false; 
            recognitionInstance.interimResults = false;

            tapZone.addEventListener('click', () => {
                if (isWorking) return;
                isWorking = true;
                
                synth.cancel(); // Stop old audio instantly

                recognitionInstance.lang = 'hi-IN'; 
                
                // Triggers Thoughtful Listening Face Expression Change
                avatarContainer.className = "avatar-container listening";
                statusPill.className = "status-pill listening-mode";
                statusPill.innerText = "Listening...";
                subtitles.innerText = "Boliyen, mai dhyan se sun rahi hu...";
                
                // 5s Faster Visual Progress Bar Animation
                timerBar.style.transition = 'none';
                timerBar.style.width = '0%';
                setTimeout(() => {
                    timerBar.style.transition = 'width 5s linear';
                    timerBar.style.width = '100%';
                }, 50);

                try {
                    recognitionInstance.start();
                } catch(e) {
                    recognitionInstance.stop();
                    setTimeout(() => { recognitionInstance.start(); }, 200);
                }

                // Strict 5 Seconds Time Cutoff Limit
                maxTimeLimit = setTimeout(() => {
                    subtitles.innerText = "5s Over! Processing...";
                    recognitionInstance.stop();
                }, 5000);
            });

            recognitionInstance.onresult = (event) => {
                clearTimeout(maxTimeLimit);
                const fullTranscript = event.results[0][0].transcript;

                if(fullTranscript && fullTranscript.trim() !== "") {
                    subtitles.innerText = `"${fullTranscript}"`;
                    avatarContainer.className = "avatar-container"; 
                    speakBack(fullTranscript);
                } else {
                    resetToReady();
                }
            };

            recognitionInstance.onerror = () => { 
                clearTimeout(maxTimeLimit);
                resetToReady(); 
            };
            
            recognitionInstance.onend = () => {
                clearTimeout(maxTimeLimit);
                if (avatarContainer.classList.contains('listening') && !synth.speaking) {
                    setTimeout(() => { if(isWorking && !synth.speaking) resetToReady(); }, 800);
                }
            };
        } else {
            subtitles.innerText = "Voice Recognition not supported.";
        }

        function speakBack(text) {
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();

            let isGujarati = /[આ-હ]/.test(text) || ["kem", "cho", "tame", "nathi", "bhai"].some(w => text.toLowerCase().includes(w));
            let isHindi = /[अ-ह]/.test(text) || ["kya", "hai", "kaise", "aap", "ho"].some(w => text.toLowerCase().includes(w));

            if (isGujarati) {
                utterance.voice = voices.find(v => v.lang.includes('gu-IN')) || voices.find(v => v.lang.includes('hi-IN')) || voices[0];
                utterance.lang = 'gu-IN';
            } else if (isHindi) {
                utterance.voice = voices.find(v => v.lang.includes('hi-IN')) || voices[0];
                utterance.lang = 'hi-IN';
            } else {
                utterance.voice = voices.find(v => v.lang.includes('en-')) || voices[0];
                utterance.lang = 'en-US';
            }

            // Triggers Lips-Working and Eyes-Blinking Active Loop Animation
            utterance.onstart = () => {
                avatarContainer.className = "avatar-container speaking";
                statusPill.className = "status-pill speaking-mode";
                statusPill.innerText = "Speaking";
            };

            utterance.onend = () => { resetToReady(); };
            utterance.onerror = () => { resetToReady(); };

            setTimeout(() => {
                synth.speak(utterance);
            }, 100);
        }

        function resetToReady() {
            avatarContainer.className = "avatar-container";
            statusPill.className = "status-pill ready";
            statusPill.innerText = "Tap to Talk (Max 5s)";
            timerBar.style.transition = 'none';
            timerBar.style.width = '0%';
            isWorking = false;
        }

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
        }
    </script>
</body>
</html>
