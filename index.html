<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shinobu 15s Talking Avatar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080511;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 30% 20%, #4a154b 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, #1a2a6c 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #080511 0%, #020105 100%);
            z-index: 1;
            filter: blur(20px);
            animation: bgShift 15s infinite alternate linear;
        }
        @keyframes bgShift { 0% { transform: rotate(0deg) scale(1); } 100% { transform: rotate(360deg) scale(1.1); } }
        .particle-container { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .particle { position: absolute; background: radial-gradient(circle, rgba(187, 134, 252, 0.8) 0%, rgba(187, 134, 252, 0) 70%); border-radius: 50%; animation: floatUp 8s infinite linear; }
        @keyframes floatUp { 0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; } 50% { opacity: 0.7; } 100% { transform: translateY(-10vh) translateX(50px) scale(1.2); opacity: 0; } }
        .mobile-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .avatar-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; padding: 10px; }
        .avatar-container { width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 0 25px rgba(155, 89, 182, 0.3); transition: all 0.3s ease; position: relative; }
        .avatar-img { width: 100%; height: auto; display: block; object-fit: cover; pointer-events: none; }
        @keyframes avatarSpeak {
            0% { transform: scale(1) translateY(0); }
            25% { transform: scale(1.02) translateY(-3px); }
            50% { transform: scale(0.99) translateY(1px); }
            75% { transform: scale(1.03) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes avatarListen { 0% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.6); } 50% { box-shadow: 0 0 40px rgba(52, 152, 219, 1); } 100% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.6); } }
        .listening { animation: avatarListen 1.5s infinite ease-in-out; }
        .speaking { animation: avatarSpeak 0.15s infinite alternate ease-in-out; }
        .hud-display { background: rgba(13, 8, 24, 0.9); backdrop-filter: blur(10px); padding: 25px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: calc(25px + env(safe-area-inset-bottom)); }
        .status-pill { display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; background: rgba(255, 255, 255, 0.1); margin-bottom: 12px; }
        .status-pill.ready { color: #a29bfe; border: 1px solid #6c5ce7; }
        .status-pill.listening-mode { color: #3498db; border: 1px solid #3498db; }
        .status-pill.speaking-mode { color: #e84393; border: 1px solid #e84393; }
        .subtitle-box { font-size: 1.1rem; color: #f1f2f6; min-height: 50px; line-height: 1.4; }
        
        /* 15s Timer Progress Bar */
        .timer-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: #3498db;
            width: 0%;
            transition: width 15s linear;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="particle-container" id="particleContainer"></div>

    <div class="mobile-frame">
        <!-- 15 Seconds Time Visualizer -->
        <div class="timer-bar" id="timerBar"></div>
        
        <div style="height: 30px;"></div>
        <div class="avatar-wrapper" id="tapZone">
            <div class="avatar-container" id="avatarContainer">
                <!-- App can use 1387209.jpg locally in the folder -->
                <img src="1387209.jpg" alt="Shinobu" class="avatar-img" id="animeImage">
            </div>
        </div>
        <div class="hud-display">
            <div class="status-pill ready" id="statusPill">Tap to Talk (Max 15s)</div>
            <div class="subtitle-box" id="subtitles">Hindi, English, ya Gujarati me boliye...</div>
        </div>
    </div>

    <script>
        // Particles Background Loop
        const pContainer = document.getElementById('particleContainer');
        for(let i=0; i<15; i++) {
            let p = document.createElement('div');
            p.classList.add('particle');
            p.style.width = p.style.height = Math.random() * 6 + 4 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDelay = Math.random() * 5 + 's';
            pContainer.appendChild(p);
        }

        // Voice Engine & Timers
        const tapZone = document.getElementById('tapZone');
        const avatarContainer = document.getElementById('avatarContainer');
        const statusPill = document.getElementById('statusPill');
        const subtitles = document.getElementById('subtitles');
        const timerBar = document.getElementById('timerBar');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let isWorking = false;
        let maxTimeLimit;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true; // Kept true so it doesn't cut off mid-sentence before 15s
            recognition.interimResults = false;

            tapZone.addEventListener('click', () => {
                if (isWorking) return;
                isWorking = true;
                synth.cancel();

                recognition.lang = 'hi-IN'; 
                avatarContainer.className = "avatar-container listening";
                statusPill.className = "status-pill listening-mode";
                statusPill.innerText = "Listening...";
                subtitles.innerText = "Suno, mai 15 seconds tak sun rahi hu...";
                
                // Start Timer Bar Animation
                timerBar.style.transition = 'none';
                timerBar.style.width = '0%';
                setTimeout(() => {
                    timerBar.style.transition = 'width 15s linear';
                    timerBar.style.width = '100%';
                }, 50);

                recognition.start();

                // Hard Stop Recognition after exactly 15 seconds
                maxTimeLimit = setTimeout(() => {
                    recognition.stop();
                }, 15000);
            });

            recognition.onresult = (event) => {
                // Clear the 15s timeout since recognition stopped/finished
                clearTimeout(maxTimeLimit);
                timerBar.style.transition = 'none';
                timerBar.style.width = '0%';

                // Gather everything spoken within those 15 seconds
                let fullTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        fullTranscript += event.results[i][0].transcript;
                    }
                }

                if(fullTranscript.trim() !== "") {
                    subtitles.innerText = `"${fullTranscript}"`;
                    avatarContainer.className = "avatar-container"; 
                    speakBack(fullTranscript);
                } else {
                    resetToReady();
                }
            };

            recognition.onerror = () => { 
                clearTimeout(maxTimeLimit);
                resetToReady(); 
            };
            
            recognition.onend = () => {
                clearTimeout(maxTimeLimit);
                // If it ended naturally without results
                if (avatarContainer.classList.contains('listening')) {
                    resetToReady();
                }
            };
        }

        function speakBack(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();

            let isGujarati = /[આ-હ]/.test(text) || ["kem", "cho", "tame", "nathi", "bhai"].some(w => text.toLowerCase().includes(w));
            let isHindi = /[अ-ह]/.test(text) || ["kya", "hai", "kaise", "aap", "ho"].some(w => text.toLowerCase().includes(w));

            if (isGujarati) {
                utterance.voice = voices.find(v => v.lang.includes('gu-IN')) || voices[0];
                utterance.lang = 'gu-IN';
            } else if (isHindi) {
                utterance.voice = voices.find(v => v.lang.includes('hi-IN')) || voices[0];
                utterance.lang = 'hi-IN';
            } else {
                utterance.voice = voices.find(v => v.lang.includes('en-')) || voices[0];
                utterance.lang = 'en-US';
            }

            utterance.onstart = () => {
                avatarContainer.className = "avatar-container speaking";
                statusPill.className = "status-pill speaking-mode";
                statusPill.innerText = "Speaking";
            };

            utterance.onend = () => { resetToReady(); };
            utterance.onerror = () => { resetToReady(); };

            synth.speak(utterance);
        }

        function resetToReady() {
            avatarContainer.className = "avatar-container";
            statusPill.className = "status-pill ready";
            statusPill.innerText = "Tap to Talk (Max 15s)";
            timerBar.style.transition = 'none';
            timerBar.style.width = '0%';
            isWorking = false;
        }
    </script>
</body>
</html>
